name: Deploy Static Web App

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push to main

permissions:
  contents: write # Needed to push built files to your gh-pages deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Automatically find and replace placeholders with repository secrets
      - name: Inject Credentials/Secrets
        run: |
          echo "Injecting Firebase and EmailJS secrets into site layouts..."
          sed -i "s/{{FIREBASE_API_KEY}}/${{ secrets.FIREBASE_API_KEY }}/g" index.html
          sed -i "s/{{EMAILJS_PUBLIC_KEY}}/${{ secrets.EMAILJS_PUBLIC_KEY }}/g" index.html
          sed -i "s/{{FIREBASE_API_KEY}}/${{ secrets.FIREBASE_API_KEY }}/g" admin.html
          sed -i "s/{{EMAILJS_PUBLIC_KEY}}/${{ secrets.EMAILJS_PUBLIC_KEY }}/g" admin.html

      # 3. Deploy the compiled files to GitHub Pages branch
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        # Deploys your root folder files
          branch: gh-pages # Pushes built files to gh-pages branch
